services:
  tts-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: tts-streaming-api:latest
    container_name: tts-api
    restart: unless-stopped
    ports:
      - "9000:8000"
    volumes:
      - ./reference_voices:/app/reference_voices
      - ./speaker_embeddings:/app/speaker_embeddings
      - ./models_cache:/app/models_cache
    environment:
      - LOG_LEVEL=info
    # ── GPU support (uncomment khi dùng XTTS v2 trên server có NVIDIA GPU) ──
